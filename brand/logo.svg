<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="frame"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="#FF6A00"/>
    <g transform="rotate(-6 256 300) translate(-12 14)">

    <!-- owl head with ear tufts, running off the bottom edge -->
    <path d="M58 560 L52 300 Q50 190 78 92 Q120 128 158 162 Q256 126 352 156 Q392 120 440 84 Q478 200 470 320 L476 560 Z"
          fill="#FFFFFF" stroke="#141414" stroke-width="14" stroke-linejoin="round"/>

    <!-- forehead feathers -->
    <g fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round">
      <path d="M232 182 L244 202"/>
      <path d="M262 176 L262 198"/>
      <path d="M292 182 L280 202"/>
    </g>

    <!-- left eye: big, looking sideways -->
    <circle cx="190" cy="292" r="74" fill="#FFFFFF" stroke="#141414" stroke-width="13"/>
    <circle cx="166" cy="296" r="28" fill="#141414"/>
    <circle cx="157" cy="286" r="8" fill="#FFFFFF"/>

    <!-- right eye: smaller pupil, the googly one -->
    <circle cx="368" cy="276" r="58" fill="#FFFFFF" stroke="#141414" stroke-width="13"/>
    <circle cx="378" cy="282" r="14" fill="#141414"/>

    <!-- beak -->
    <path d="M262 340 L298 340 L280 376 Z" fill="#FF6A00" stroke="#141414" stroke-width="10" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
