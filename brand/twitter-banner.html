<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1500px;height:500px;overflow:hidden;background:#FF6A00}
  *{box-sizing:border-box}
  .b{position:relative;width:1500px;height:500px;font-family:'Space Grotesk',system-ui,sans-serif;color:#141414;
     background:radial-gradient(900px 420px at 78% 120%,#FF9A3D 0%,#FF7A12 55%,#FF6A00 100%)}
  .grid{position:absolute;inset:0;opacity:.1;background-image:linear-gradient(#141414 1px,transparent 1px),linear-gradient(90deg,#141414 1px,transparent 1px);background-size:50px 50px;
     -webkit-mask-image:radial-gradient(800px 320px at 78% 100%,#000,transparent)}
  /* kept high: the X profile photo covers the bottom-left */
  .logo{position:absolute;left:100px;top:60px;width:220px;height:220px;border-radius:50px;border:6px solid #141414;box-shadow:9px 9px 0 #141414;transform:rotate(-5deg)}
  .t{position:absolute;left:390px;top:78px;width:660px}
  h1{margin:0;font-size:70px;line-height:1;letter-spacing:-3px}
  h1 span{color:#fff;-webkit-text-stroke:3px #141414}
  p{margin:22px 0 0;font-size:28px;font-weight:700;line-height:1.3}
  .tag{position:absolute;left:390px;top:404px;display:inline-flex;gap:10px;padding:8px 18px;border:3px solid #141414;background:#141414;color:#fff;border-radius:999px;font-size:20px;font-weight:700;letter-spacing:2px}
  .tag b{color:#FF6A00}
  .flow{position:absolute;left:1060px;top:52px;width:360px;background:#fff;border:5px solid #141414;border-radius:28px;box-shadow:10px 10px 0 #141414;padding:20px;transform:rotate(2deg);display:flex;flex-direction:column;gap:8px;text-align:center}
  .s{border:3px solid #141414;border-radius:16px;padding:10px;background:#fff3e8;font-weight:700;font-size:22px}
  .s small{display:block;font-weight:500;font-size:15px;color:#5a3a22}
  .s.hot{background:#FF6A00}
  .a{font-size:24px;font-weight:700;line-height:1}
  .coin{position:absolute;border-radius:50%;background:#FFC524;border:5px solid #141414;display:grid;place-items:center;font-weight:900}
</style></head>
<body><div class="b">
  <div class="grid"></div>
  <img class="logo" src="logo.svg">
  <div class="t">
    <h1>Hold <span>$EARN</span>.<br>Earn every trade.</h1>
    <p>Every buy &amp; sell is taxed.<br>The tax goes back to holders.</p>
  </div>
  <div class="tag">TAX REWARDS · ON <b>NEAR</b> · JUSTHOOT.FUN</div>
  <div class="flow">
    <div class="s">Someone trades<small>buy or sell $EARN</small></div>
    <div class="a">↓</div>
    <div class="s hot">Tax collected<small style="color:#141414">on every trade</small></div>
    <div class="a">↓</div>
    <div class="s">Holders earn 💰<small>just hold, nothing to do</small></div>
  </div>
  <div class="coin" style="left:1015px;top:330px;width:70px;height:70px;font-size:32px;transform:rotate(-12deg)">$</div>
  <div class="coin" style="left:1420px;top:24px;width:52px;height:52px;font-size:24px">$</div>
</div></body></html>
