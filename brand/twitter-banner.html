<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1500px;height:500px;overflow:hidden;background:#FF6A00}
  .b{position:relative;width:1500px;height:500px;font-family:'Space Grotesk',system-ui,sans-serif;color:#141414;
     background:radial-gradient(900px 420px at 70% 115%,#FF9A3D 0%,#FF7A12 55%,#FF6A00 100%)}
  .grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#141414 1px,transparent 1px),linear-gradient(90deg,#141414 1px,transparent 1px);background-size:50px 50px;
     -webkit-mask-image:radial-gradient(700px 300px at 70% 100%,#000,transparent)}
  .txt{position:absolute;left:470px;top:92px}
  h1{margin:0;font-size:128px;line-height:1;letter-spacing:-4px;font-weight:700}
  h1 span{color:#FFFFFF}
  p{margin:18px 0 0;font-size:34px;font-weight:500;color:#2A1405}
  p b{color:#FFFFFF;-webkit-text-stroke:1.5px #141414}
  .tag{display:inline-flex;gap:10px;align-items:center;margin-top:26px;padding:10px 20px;border:3px solid #141414;background:#FFFFFF;border-radius:999px;font-size:22px;font-weight:700;color:#141414;letter-spacing:2px}
  .logo{position:absolute;left:120px;top:70px;width:300px;height:300px;border-radius:66px;border:6px solid #141414;box-shadow:10px 10px 0 #141414}
  .cap{position:absolute;border-radius:50%;background:linear-gradient(#FFFFFF 0 50%,#FFD3B0 50% 100%);border:5px solid #141414;box-sizing:border-box}
  .cap::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 3px);height:6px;background:#141414}
</style></head>
<body><div class="b">
  <div class="grid"></div>
  <img class="logo" src="logo.svg">
  <div class="txt">
    <h1>EARN<span>.</span></h1>
    <p><b>100%</b> of creator fees &rarr; <b>10</b> random holders.</p>
    <p style="margin-top:6px">Hold. Enter. Pull the gacha.</p>
    <div class="tag">BUILT ON NEAR</div>
  </div>
  <div class="cap" style="width:120px;height:120px;left:1250px;top:60px"></div>
  <div class="cap" style="width:70px;height:70px;left:1380px;top:230px;opacity:.85"></div>
  <div class="cap" style="width:90px;height:90px;left:1200px;top:330px;opacity:.7"></div>
  <div class="cap" style="width:46px;height:46px;left:1150px;top:215px;opacity:.6"></div>
</div></body></html>
