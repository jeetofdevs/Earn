<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.l{position:absolute;left:60px;top:60px;width:500px}
.row{display:flex;flex-direction:column;gap:22px}
.box{padding:26px 28px}
.box small{display:block;font-weight:700;letter-spacing:2px;font-size:18px;margin-bottom:8px}
.box b{font-size:40px;letter-spacing:-1px;line-height:1.05;display:block}
.bad{background:#2a2a2a;color:#bbb;box-shadow:10px 10px 0 #141414}
.bad b{text-decoration:line-through;text-decoration-thickness:4px;color:#eee}
.r{position:absolute;left:620px;top:70px;width:530px}
h1{font-size:76px;line-height:.95;letter-spacing:-3px}
.r p{font-size:26px;line-height:1.4;margin-top:22px;color:#2a1405;font-weight:500}
.owl{position:absolute;right:60px;bottom:86px;width:150px;height:150px;transform:rotate(6deg)}
</style></head><body><div class="p"><div class="grid"></div>
<div class="l row">
  <div class="card box bad"><small>MOST TOKENS</small><b>Creator keeps the fees.</b></div>
  <div class="card box"><small>$EARN</small><b>Creator keeps <span style="color:#FF6A00">nothing</span>. Holders get 100%.</b></div>
</div>
<div class="r">
  <h1>The owl<br>never sleeps<span class="w">.</span></h1>
  <p>Every fee goes to a contract on NEAR. Every 30 minutes it pays 10 holders. Winners picked on-chain, every draw public.</p>
</div>
<img class="logo owl" src="../logo.svg">
<div class="foot"><span>FEES → POOL → HOLDERS</span><span>EVERY <b>30 MIN</b></span></div>
</div></body></html>
