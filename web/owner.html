<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>EARN Owner</title>
    <link rel="icon" href="/logo.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/"><img src="/logo.svg" alt="" /><span>EARN<i>.</i> owner</span></a>
    </header>
    <main>
      <section class="card">
        <h2>Distribute fees to holders</h2>
        <p class="muted">Preview who gets what, then pay out the fee pool now. Scheduled payouts keep running on their own.</p>
        <form id="login" class="fund">
          <input id="password" type="password" placeholder="Owner password" autocomplete="current-password" required />
          <button class="btn primary" type="submit">Preview payout</button>
        </form>
        <p class="note left" id="status"></p>
      </section>

      <section class="card" id="plan-card" hidden>
        <h2>Next payout preview</h2>
        <div class="me" id="plan-stats"></div>
        <ul class="winners" id="plan-list"></ul>
        <div class="actions left">
          <button id="send-btn" class="btn primary">Distribute now</button>
        </div>
        <p class="muted small">Payouts go out in batches of 25 per transaction from the fee wallet. Failed batches stay in the pool for the next round.</p>
      </section>
    </main>
    <script type="module" src="/src/owner.js"></script>
  </body>
</html>
