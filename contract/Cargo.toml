[package]
name = "earn-gacha"
version = "0.1.0"
edition = "2021"
description = "Earn: send 100% of creator fees to 10 random token holders"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
